name: Testes Automatizados em Python

# Gatilhos que disparam a execução da pipeline
on:
  push:
    branches: [ "main", "develop" ]
  

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório na máquina virtual do GitHub Actions
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configura a versão do Python no ambiente
      - name: Configurar o Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Ativa o cache para acelerar futuras execuções de instalações de pacotes

      # 3. Atualiza o pip e instala as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Se usar pytest para testes, certifique-se de que ele esteja instalado
          pip install pytest

      # 4. Executa a suíte de testes
      - name: Executar testes com pytest
        run: |
          pytest
