name: Deploy Frontend Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: oficina-costura-admin-painel
  CLOUDFRONT_DISTRIBUTION_ID: E1AJ08U38CATEK
  CLOUDFRONT_URL: https://d344yz7xjvxwku.cloudfront.net

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Build do projeto
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: 🔐 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Listar CloudFronts disponíveis (debug)
        run: |
          echo "=== CloudFronts disponíveis ==="
          aws cloudfront list-distributions \
            --query 'DistributionList.Items[*].[Id,DomainName]' \
            --output table

      - name: ☁️ Upload para o S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: 🔄 Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: ✅ Deploy concluído
        run: |
          echo "🎉 Deploy realizado com sucesso!"
          echo "🌐 Acesse: ${{ env.CLOUDFRONT_URL }}"
