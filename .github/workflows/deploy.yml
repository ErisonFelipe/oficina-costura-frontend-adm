name: Deploy Frontend Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: oficina-costura-admin-painel
  CLOUDFRONT_DOMAIN: d344yz7xjvxwku.cloudfront.net

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Build do projeto
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: 🔐 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☁️ Upload para o S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: 🔄 Invalidar cache do CloudFront
        run: |
          # Descobre o ID automaticamente pela AWS, sem digitar
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${{ env.CLOUDFRONT_DOMAIN }}'].Id" \
            --output text)
          
          echo "CloudFront ID encontrado: $DIST_ID"
          echo "Length: ${#DIST_ID}"
          
          if [ -z "$DIST_ID" ]; then
            echo "❌ CloudFront não encontrado para o domínio ${{ env.CLOUDFRONT_DOMAIN }}"
            exit 1
          fi
          
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

      - name: ✅ Deploy concluído
        run: |
          echo "🎉 Deploy realizado com sucesso!"
          echo "🌐 Acesse: https://${{ env.CLOUDFRONT_DOMAIN }}"
