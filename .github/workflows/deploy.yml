name: Deploy Frontend Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔨 Build do projeto
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: 🔐 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ☁️ Upload para o S3
        run: |
          aws s3 sync dist/ s3://oficina-costura-admin-painel --delete

      - name: 🔄 Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "E1AJ08U38CATEK" \
            --paths "/*"

      - name: ✅ Deploy concluído
        run: |
          echo "🎉 Deploy realizado com sucesso!"
          echo "🌐 Acesse: https://d344yz7xjvxwku.cloudfront.net"
